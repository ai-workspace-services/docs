services:
  docs-service:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      KNOWLEDGE_REPO_PATH: /knowledge
      KNOWLEDGE_REPO_URL: ${KNOWLEDGE_REPO_URL:-https://github.com/haitaopanhq/knowledge.git}
      KNOWLEDGE_REPO_REF: ${KNOWLEDGE_REPO_REF:-main}
      DOCS_SERVICE_PORT: 8084
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      DOCS_RELOAD_INTERVAL: ${DOCS_RELOAD_INTERVAL:-5m}
      SUPABASE_CONNECT_URI: ${SUPABASE_CONNECT_URI:-}
      SUPABASE_CONNECT_URL: ${SUPABASE_CONNECT_URL:-}
    volumes:
      - ${KNOWLEDGE_REPO_PATH_HOST:?set KNOWLEDGE_REPO_PATH_HOST}:/knowledge
    ports:
      - "8084:8084"
