name: docs.svc.plus Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deployment_environment:
        description: Deployment environment
        required: true
        default: uat
        type: choice
        options: [dev, uat, prod]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docs-pipeline-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEFAULT_DOCS_CANONICAL_DOMAIN: docs.svc.plus

jobs:
  prep:
    name: Prep
    runs-on: ubuntu-latest
    outputs:
      push_image: ${{ steps.flags.outputs.push_image }}
      deployment_environment: ${{ steps.flags.outputs.deployment_environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve pipeline flags
        id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          INPUT_ENV: ${{ inputs.deployment_environment }}
        run: .github/scripts/resolve-workflow-inputs.sh

  build:
    name: Build
    needs: prep
    runs-on: ubuntu-latest
    env:
      SERVICE_REGISTRY: ghcr.io
      SERVICE_IMAGE_REPO_OWNER: ${{ vars.IMAGE_REPO_OWNER || github.repository_owner }}
      SERVICE_IMAGE_NAME: docs
    outputs:
      service_image_repo: ${{ steps.service_image.outputs.repo }}
      service_image_ref: ${{ steps.service_ref.outputs.image_ref }}
      service_image_tag: ${{ steps.service_ref.outputs.image_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Fetch Vault Secrets
        if: needs.prep.outputs.push_image == 'true'
        uses: hashicorp/vault-action@v3.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          role: github-actions-docs-${{ needs.prep.outputs.deployment_environment }}
          method: jwt
          secrets: |
            kv/data/github-actions/docs GHCR_TOKEN | GHCR_TOKEN

      - name: Log in to GHCR
        if: needs.prep.outputs.push_image == 'true'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          password: ${{ env.GHCR_TOKEN || github.token }}

      - name: Resolve service image repository
        id: service_image
        run: echo "repo=${SERVICE_REGISTRY}/${SERVICE_IMAGE_REPO_OWNER}/${SERVICE_IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Compute service image tags
        id: service_meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ steps.service_image.outputs.repo }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long

      - name: Resolve service image ref
        id: service_ref
        env:
          TAGS_RAW: ${{ steps.service_meta.outputs.tags }}
        run: .github/scripts/resolve-image-ref.sh

      - name: Build and push service image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ needs.prep.outputs.push_image == 'true' }}
          tags: ${{ steps.service_meta.outputs.tags }}
          labels: ${{ steps.service_meta.outputs.labels }}

